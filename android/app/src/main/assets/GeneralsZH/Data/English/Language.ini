; -----------------------------------------------------------------------------
; GeneralsX / SandboxRTS - Language & Font configuration
; -----------------------------------------------------------------------------

Language
  UnicodeFontName = Arial

  LocalFontFile = fonts/arial.ttf
  LocalFontFile = fonts/arialbold.ttf
  LocalFontFile = fonts/couriernew.ttf
  LocalFontFile = fonts/timesnewroman.ttf

  ResolutionFontSizeAdjustment = 0.7
  ResolutionFontSizeMethod = BALANCED
  UseHardWordWrap = No
  MilitaryCaptionSpeed = 100
  MilitaryCaptionDelayMS = 750

  CopyrightFont = "Arial" 10 No
  MessageFont = "Arial" 12 No
  MilitaryCaptionTitleFont = "Arial" 12 Yes
  MilitaryCaptionFont = "Arial" 12 No
  SuperweaponCountdownNormalFont = "Arial" 12 No
  SuperweaponCountdownReadyFont = "Arial" 12 Yes
  NamedTimerCountdownNormalFont = "Arial" 12 No
  NamedTimerCountdownReadyFont = "Arial" 12 Yes
  DrawableCaptionFont = "Arial" 10 No
  DefaultWindowFont = "Arial" 10 No
  DefaultDisplayStringFont = "Arial" 10 No
  TooltipFontName = "Arial" 8 No
  NativeDebugDisplay = "Arial" 8 No
  DrawGroupInfoFont = "Arial" 8 No
  CreditsTitleFont = "Arial" 24 Yes
  CreditsMinorTitleFont = "Arial" 16 Yes
  CreditsNormalFont = "Arial" 14 No
End
